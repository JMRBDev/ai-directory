name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the release binaries
        run: pnpm release:build

      - name: Verify the tag matches the package version
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v${PACKAGE_VERSION}" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version v${PACKAGE_VERSION}."
            echo "Bump the version in the root package.json to match the tag (or retag), then rerun."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $PACKAGE_VERSION."

      - name: Smoke test the Linux release binary
        run: |
          set -euo pipefail
          BIN="apps/cli/dist/aid-linux-x64"
          chmod +x "$BIN"
          VERSION=$(node -p "require('./package.json').version")
          sh -n install.sh
          "$BIN" --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          "$BIN" --help | grep -E 'self-update'
          "$BIN" __selfcheck --expected-version "$VERSION" | grep '"ok":true'
          "$BIN" web --host 127.0.0.1 --port 0 --no-token > /tmp/aid-web.log 2>&1 &
          AID_PID=$!
          trap 'kill -INT "$AID_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            PORT=$(grep -oE 'listening on http://127\.0\.0\.1:[0-9]+' /tmp/aid-web.log | head -1 | grep -oE '[0-9]+$' || true)
            [ -n "$PORT" ] && break
            sleep 0.2
          done
          [ -n "$PORT" ]
          curl -fsS "http://127.0.0.1:${PORT}/health" | grep "\"version\":\"${VERSION}\""
          curl -fsS "http://127.0.0.1:${PORT}/" | grep '<div id="root"></div>'

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          cd apps/cli/dist
          # Publish a checksums file alongside the binaries so the installer can
          # verify downloads without parsing the GitHub API.
          sha256sum aid-darwin-arm64 aid-darwin-x64 aid-linux-x64 aid-windows-x64.exe > aid-checksums.txt
          cd "$GITHUB_WORKSPACE"
          # GitHub also computes a sha256 digest for each uploaded asset
          # automatically; self-update reads that digest to verify downloads.
          gh release create "$GITHUB_REF_NAME" \
            apps/cli/dist/aid-darwin-arm64 \
            apps/cli/dist/aid-darwin-x64 \
            apps/cli/dist/aid-linux-x64 \
            apps/cli/dist/aid-windows-x64.exe \
            apps/cli/dist/aid-checksums.txt \
            install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "AI Directory $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
